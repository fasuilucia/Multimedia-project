<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link type="text/css" rel="stylesheet" href="style.css">
    <title>Jigsaw Puzzle Game</title>
</head>

<body>
    <video id="backgroundVideo" autoplay loop muted>
        <source src="background_video.mp4" type="video/mp4">
    </video>

    <div class="container text-center">
        <h1> Jigsaw Puzzle Game </h1>

        <audio id="congratulationSound" preload="auto">
            <source src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" type="audio/mpeg">
        </audio>

        <div class="grid">
            <div class="cell"> </div>
            <div class="cell"> </div>
            <div class="cell"> </div>
            <div class="cell"> </div>
            <div class="cell"> </div>
            <div class="cell"> </div>
            <div class="cell"> </div>
            <div class="cell"> </div>
            <div class="cell"> </div>
        </div>
        <div class="pieces_row" id="pieces_row">
            <div class="piece"></div>
            <div class="piece"></div>
            <div class="piece"></div>
            <div class="piece"></div>
            <div class="piece"></div>
            <div class="piece"></div>
            <div class="piece"></div>
            <div class="piece"></div>
            <div class="piece"></div>
        </div>
        <div class="buttons">
            <label class="btn btn-primary">
                Upload An Image
                <input type="file" id="upload" accept="image/*" hidden>
            </label>
            <button class="btn btn-warning" id="undo">Undo</button>
            <button class="btn btn-danger" id="give-up">Give Up</button>
        </div>
    </div>

    <div class="popupBox" id="customAlert">
        <div class="customAlertBox">
            <div class="customAlertMessage">
                🎉 Congratulations! 🎉 <br>
                You have completed the puzzle.
            </div>
            <button class="customOKButton" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
